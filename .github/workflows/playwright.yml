name: Playwright E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: # TODO

      - name: Run Playwright tests
        run: # TODO

      # Step 6 — Upload the HTML report so you can download it after the run.
      # TODO: Use the actions/upload-artifact@v4 action with these settings:
      #   - Run this step even when tests fail (if: always())
      #   - Name the artifact 'playwright-report'
      #   - Upload the 'playwright-report/' folder
      #   - Keep the artifact for 14 days (retention-days)
      # See README.md Part III — Step 9 for the full syntax.
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14